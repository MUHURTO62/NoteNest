services:
  - type: web
    name: notenest
    env: python
    pythonVersion: 3.12.0
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: PYTHONPATH=backend gunicorn backend.notenest_project.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        scope: build,runtime
        value: ""
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,127.0.0.1,localhost"
      - key: DATABASE_URL
        scope: runtime
        value: ""
    # Configure a Render PostgreSQL database and set DATABASE_URL to the service connection string.
